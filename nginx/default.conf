# Static server for the built simulator (nginx-unprivileged listens on 8080).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # onnxruntime-web ships an ES module named *.mjs. Older nginx mime.types do
    # not know the extension and answer application/octet-stream, which browsers
    # refuse for module scripts, so boot would halt at "no available backend".
    # (A `types {}` block here would replace the whole inherited map, so use
    # default_type, which only applies to extensions the map does not know.)
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # hashed build output never changes
    location /bundle/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
