name: Microduck
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Microduck:
    type: application
    platform: iOS
    sources:
      - path: Microduck
    info:
      path: Microduck/Info.plist
      properties:
        CFBundleDisplayName: Microduck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zoo.micro.microduck
        PRODUCT_NAME: Microduck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts:
      - name: Bundle offline simulator
        script: |
          "$SRCROOT/../scripts/build-ios-web.sh"
        basedOnDependencyAnalysis: false
  MicroduckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MicroduckTests
    dependencies:
      - target: Microduck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zoo.micro.microduck.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Microduck:
    build:
      targets:
        Microduck: all
        MicroduckTests: [test]
    test:
      targets:
        - MicroduckTests
